services:
  content-scheduler:
    build:
      context: ./Content-Scheduler
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - scheduler_data:/app/data
    environment:
      - SCHEDULER_DB_PATH=/app/data/scheduler.db
      - POSTING_SERVICE_URL=http://posting-service:8001
    restart: unless-stopped

  posting-service:
    build:
      context: ./PostingService
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - posting_data:/app/data
    environment:
      - POSTING_DB_PATH=/app/data/posting.db
      - TG_ADAPTER_URL=http://tg-adapter-posting-service:8005
    restart: unless-stopped

  tg-adapter-posting-service:
    build:
      context: ./old_implementation/TgAdapterPostingService
      dockerfile: Dockerfile
    ports:
      - "8005:8005"
    restart: unless-stopped

volumes:
  scheduler_data:
  posting_data:
